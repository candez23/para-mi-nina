<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf5ee"><meta name="robots" content="noindex,nofollow"><title>Jardín para Nina · Fondo vivo</title><style>
  .nina-wallpaper-root,.nina-wallpaper{width:100%;height:100%;margin:0;overflow:hidden;background:#faf4ec}
  .nina-wallpaper{position:relative;isolation:isolate;overscroll-behavior:none}
  .nina-wallpaper .garden-canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh;touch-action:auto;user-select:none;-webkit-user-select:none}
</style></head>
<body><canvas id="garden" role="img" aria-label="Un ramo de flores que florece y se mece suavemente">Un jardín de flores para Nina</canvas><script type="application/json" id="wallpaper-options">{"theme": "blush", "density": 1, "motion": 0.8, "petals": true, "placement": "center", "fps": 30}</script><script>
(() => {
  'use strict';
  const GROWTH_SECONDS=8.5,MAX_PETALS=64,TAU=Math.PI*2;
  const defaults={theme:'blush',density:1,petals:true,motion:.8,placement:'center',fps:30};
  const themes={
    blush:{paper:'#fbf4eb',bottom:'#f1e3db',halo:'#edc9c7',vignette:'#8e6763',grain:'#553739',stem:'#788965',leaf:'#8e9b73',leafEdge:'#6d835e',gold:'#b99060',orbit:'#bf9e91',night:false},
    night:{paper:'#241c2a',bottom:'#17141e',halo:'#74475c',vignette:'#080b17',grain:'#eadacb',stem:'#859879',leaf:'#7f9871',leafEdge:'#b6c2a0',gold:'#e5bb7a',orbit:'#9b778a',night:true},
    sage:{paper:'#f0f2e7',bottom:'#e0e7d8',halo:'#d8d4ba',vignette:'#697c67',grain:'#3e5144',stem:'#617b58',leaf:'#849d71',leafEdge:'#5e7d55',gold:'#b29464',orbit:'#9eae8e',night:false}
  };
  let options={...defaults},prebootOverrides={},canvas=null,ctx=null,ready=false;
  let width=0,height=0,dpr=1,portrait=false,flowers=[],sprites=[],petalSprites=[];
  let backplate=null,grainTile=null,glowSprite=null,layoutInfo=null;
  let elapsed=0,raf=0,lastStamp=null,paintBudget=0,physicsPending=0,running=false;
  let particleBudget=0,pointer={x:-9999,y:-9999,active:false},resizeQueued=0,lastDebugStamp=-Infinity;
  const suspended=new Set();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const petalPool=Array.from({length:MAX_PETALS},()=>({active:false,age:0}));
  const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
  const hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453123;return v-Math.floor(v);};

  function sanitize(partial){
    if(!partial||typeof partial!=='object')return {};
    const clean={};
    if(Object.hasOwn(partial,'theme')&&Object.hasOwn(themes,partial.theme))clean.theme=partial.theme;
    if(Object.hasOwn(partial,'density')&&Number.isFinite(Number(partial.density)))clean.density=clamp(Number(partial.density),.6,1.4);
    if(Object.hasOwn(partial,'motion')&&Number.isFinite(Number(partial.motion)))clean.motion=clamp(Number(partial.motion),.4,1.4);
    if(Object.hasOwn(partial,'petals'))clean.petals=partial.petals===true||partial.petals===1||partial.petals==='true';
    if(['center','right','left'].includes(partial.placement))clean.placement=partial.placement;
    if([24,30,45].includes(Number(partial.fps)))clean.fps=Number(partial.fps);
    return clean;
  }

  function newCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

  // Pétalos hechos a mano y cacheados a resolución doble: sin gradientes por flor/frame.
  function makeFlowerSprite(palette,kind){
    const tile=newCanvas(320,320),c=tile.getContext('2d');if(!c)return tile;
    c.scale(2,2);c.translate(80,80);
    const colors=palette;
    const gradient=c.createLinearGradient(-34,-58,32,20);
    gradient.addColorStop(0,colors[0]);gradient.addColorStop(.48,colors[1]);gradient.addColorStop(1,colors[2]);
    const drawPetal=(angle,length,breadth,alpha=1)=>{
      c.save();c.rotate(angle);c.globalAlpha=alpha;
      c.beginPath();c.moveTo(0,7);
      c.bezierCurveTo(-breadth*.66,-5,-breadth,-length*.64,-breadth*.58,-length*.89);
      c.bezierCurveTo(-breadth*.36,-length*1.11,-3,-length*1.07,0,-length*.92);
      c.bezierCurveTo(breadth*.3,-length*1.15,breadth*.8,-length*1.02,breadth*.82,-length*.76);
      c.bezierCurveTo(breadth*.87,-length*.42,breadth*.38,-7,0,7);
      c.fillStyle=gradient;c.fill();c.strokeStyle=colors[3];c.lineWidth=.58;c.stroke();
      c.beginPath();c.moveTo(0,-8);c.quadraticCurveTo(-3,-length*.52,0,-length*.86);
      c.strokeStyle=colors[3];c.globalAlpha=alpha*.38;c.lineWidth=.55;c.stroke();c.restore();
    };
    if(kind==='daisy'){
      for(let i=0;i<14;i++){
        c.save();c.rotate(i*TAU/14);c.beginPath();c.ellipse(0,-29,7.8,29,0,0,TAU);
        c.fillStyle=gradient;c.fill();c.strokeStyle=colors[3];c.lineWidth=.55;c.stroke();
        c.beginPath();c.moveTo(0,-12);c.lineTo(0,-50);c.globalAlpha=.32;c.stroke();c.restore();
      }
    }else if(kind==='dahlia'){
      for(let layer=0;layer<3;layer++){
        const count=[13,11,9][layer],length=[57,44,29][layer],breadth=[17,16,13][layer];
        for(let i=0;i<count;i++)drawPetal(i*TAU/count+layer*.23,length,breadth,.97);
      }
    }else{
      for(let i=0;i<9;i++)drawPetal(i*TAU/9,57,33,.97);
    }
    c.beginPath();c.arc(0,0,kind==='daisy'?11.5:kind==='dahlia'?7.5:10,0,TAU);
    c.fillStyle=kind==='daisy'?'#af8f55':'#6b2c43';c.fill();
    c.beginPath();c.arc(0,0,kind==='dahlia'?4.1:5.8,0,TAU);c.fillStyle='#d5ab62';c.fill();
    for(let i=0;i<9;i++){const a=i*TAU/9;c.beginPath();c.arc(Math.cos(a)*7.3,Math.sin(a)*7.3,.95,0,TAU);c.fillStyle='#fff0c6';c.fill();}
    return tile;
  }

  function prepareSprites(){
    if(sprites.length)return;
    const palettes=[
      ['#fff2e8','#efb0aa','#c77b8d','#b36b7d'],
      ['#fce5ea','#d89eb3','#ac6782','#a3667c'],
      ['#fff9e9','#f1e2c8','#d7b99a','#c4ab8c'],
      ['#f6e1ea','#cb94ad','#9d6c91','#946480'],
      ['#fff0df','#efbca5','#cf917f','#bc8377'],
      ['#fff9f0','#f1e8db','#dac9b7','#c6b5a4'],
      ['#ffe4e2','#e29aa4','#bb657f','#ac6077'],
      ['#f5e8ef','#cdb5cb','#ab8da9','#947a93']
    ];
    // Cosmos amplios, dalias en capas y margaritas marfil mezclados en el ramo.
    sprites=palettes.map((p,i)=>makeFlowerSprite(p,i===2||i===5?'daisy':i===3||i===6?'dahlia':'cosmos'));
    petalSprites=palettes.map(p=>{
      const tile=newCanvas(48,66),c=tile.getContext('2d');if(!c)return tile;
      const gradient=c.createLinearGradient(0,0,42,63);gradient.addColorStop(0,p[0]);gradient.addColorStop(.55,p[1]);gradient.addColorStop(1,p[2]);
      c.beginPath();c.moveTo(24,62);c.bezierCurveTo(-5,36,2,5,23,3);c.bezierCurveTo(46,-2,51,35,24,62);c.fillStyle=gradient;c.fill();
      c.strokeStyle=p[3];c.globalAlpha=.45;c.lineWidth=.8;c.stroke();return tile;
    });
    glowSprite=newCanvas(64,64);
    const g=glowSprite.getContext('2d');
    if(g){const light=g.createRadialGradient(32,32,0,32,32,31);light.addColorStop(0,'#ffedbf');light.addColorStop(.12,'#f9dba1b3');light.addColorStop(.4,'#e6ba742a');light.addColorStop(1,'#e6ba7400');g.fillStyle=light;g.fillRect(0,0,64,64);}
  }

  function makeGrain(){
    if(grainTile)return;
    grainTile=newCanvas(192,192);const g=grainTile.getContext('2d');if(!g)return;
    for(let i=0;i<2200;i++){
      const value=i%2?40:240;g.fillStyle=`rgba(${value},${value-6},${value-9},${.018+hash(i+11)*.037})`;
      g.fillRect(Math.floor(hash(i+71)*192),Math.floor(hash(i+331)*192),1,1);
    }
  }

  function paintBackground(){
    if(!width||!height||!layoutInfo)return;
    backplate=newCanvas(canvas.width,canvas.height);const b=backplate.getContext('2d');if(!b)return;
    b.scale(dpr,dpr);const theme=themes[options.theme];
    const paper=b.createLinearGradient(0,0,width*.76,height);
    paper.addColorStop(0,theme.paper);paper.addColorStop(1,theme.bottom);b.fillStyle=paper;b.fillRect(0,0,width,height);
    const halo=b.createRadialGradient(layoutInfo.cx,layoutInfo.cy,0,layoutInfo.cx,layoutInfo.cy,Math.max(layoutInfo.rx,layoutInfo.ry)*1.8);
    halo.addColorStop(0,theme.halo);halo.addColorStop(.47,theme.halo+'66');halo.addColorStop(1,theme.halo+'00');b.globalAlpha=theme.night?.34:.42;b.fillStyle=halo;b.fillRect(0,0,width,height);b.globalAlpha=1;
    const vignette=b.createRadialGradient(width*.5,height*.44,Math.min(width,height)*.26,width*.5,height*.44,Math.hypot(width,height)*.67);
    vignette.addColorStop(0,theme.vignette+'00');vignette.addColorStop(1,theme.vignette+(theme.night?'50':'16'));b.fillStyle=vignette;b.fillRect(0,0,width,height);
    makeGrain();if(grainTile){const pattern=b.createPattern(grainTile,'repeat');if(pattern){b.globalAlpha=theme.night?.37:.48;b.fillStyle=pattern;b.fillRect(0,0,width,height);b.globalAlpha=1;}}
    // Una órbita botánica discreta permanece detrás de todas las flores.
    b.save();b.translate(layoutInfo.cx,layoutInfo.cy);b.rotate(-.1);b.setLineDash([1,9]);b.strokeStyle=theme.orbit;b.globalAlpha=theme.night?.16:.22;b.lineWidth=.8;
    b.beginPath();b.ellipse(0,0,layoutInfo.rx*1.035,layoutInfo.ry*1.07,0,0,TAU);b.stroke();b.restore();
    if(document.body)document.body.style.backgroundColor=theme.paper;
  }

  function buildLayout(){
    if(!ready||!width||!height)return;
    portrait=height>width*1.13;
    const minSide=Math.min(width,height),count=Math.min(portrait?160:220,Math.round((portrait?140:186)*Math.sqrt(options.density)));
    const maxRadius=portrait?clamp(minSide*.047,17,34):clamp(minSide*.042,24,58);
    const rx=portrait?width*.417:Math.min(width*(options.placement==='center'?.345:.285),height*.68);
    const ry=portrait?height*.205:Math.min(height*.263,width*.195);
    let cx=width*(portrait?.5:options.placement==='right'?.68:options.placement==='left'?.32:.5);
    cx=clamp(cx,rx+maxRadius*.55+8,width-rx-maxRadius*.55-8);
    const cy=portrait?height*.485:height*.448;
    const baseY=portrait?height*.903:height*.91;
    layoutInfo={cx,cy,rx,ry,baseY,maxRadius};
    flowers=Array.from({length:count},(_,i)=>{
      const angle=i*2.399963229728653,ring=Math.sqrt((i+.4)/count);
      const scallop=.97+.026*Math.sin(angle*5)+.017*Math.cos(angle*9);
      const restX=cx+Math.cos(angle)*rx*ring*scallop;
      const restY=cy+Math.sin(angle)*ry*ring+.018*height*ring*ring;
      const seed=hash(i+17),size=maxRadius*(.68+(1-ring)*.46+seed*.25);
      return{id:i,restX,restY,x:restX,y:restY,vx:0,vy:0,ring,size,
        phase:hash(i+4)*TAU,turn:(hash(i+6)-.5)*.68,
        sprite:Math.floor(hash(i+13)*sprites.length),
        birth:(1-ring)*6.55+hash(i+38)*.24,
        baseX:cx+(hash(i+90)-.5)*Math.min(width*.105,height*.13),
        baseY:baseY+(hash(i+47)-.5)*height*.014,
        leaf:i%3===0,leafSide:i%2?1:-1};
    });
    flowers.sort((a,b)=>a.restY-b.restY);
    paintBackground();
  }

  function resize(){
    if(!canvas||!ctx)return;
    width=Math.max(1,Math.round(window.innerWidth||canvas.clientWidth||1));
    height=Math.max(1,Math.round(window.innerHeight||canvas.clientHeight||1));
    // El límite conserva nitidez sin reservar varias superficies gigantes.
    dpr=Math.min(window.devicePixelRatio||1,2,Math.sqrt(10000000/(width*height)));
    canvas.width=Math.max(1,Math.round(width*dpr));canvas.height=Math.max(1,Math.round(height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);
    buildLayout();
    for(const p of petalPool)if(p.active){p.x=clamp(p.x,-30,width+30);p.y=clamp(p.y,-60,height+30);}
    drawFrame(0);ensureRunning();
  }

  function drawLeaf(x,y,angle,size,opacity){
    const theme=themes[options.theme];ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=opacity;
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-size*.46,-size*.45,-size*.31,-size*1.1,0,-size*1.25);ctx.bezierCurveTo(size*.43,-size*.83,size*.42,-size*.24,0,0);
    ctx.fillStyle=theme.leaf;ctx.fill();ctx.strokeStyle=theme.leafEdge;ctx.lineWidth=.7;ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-size*1.1);ctx.globalAlpha=opacity*.6;ctx.lineWidth=.55;ctx.stroke();ctx.restore();
  }

  function updateFlowers(dt){
    if(reduced.matches)return;
    const steps=dt>.04?2:1,step=Math.min(.07,dt)/steps;
    for(let k=0;k<steps;k++)for(const flower of flowers){
      const wind=Math.sin(elapsed*.56*options.motion+flower.phase)*(1.8+flower.ring*1.5)*options.motion;
      const breathe=Math.cos(elapsed*.4*options.motion+flower.phase)*.8*options.motion;
      let ax=(flower.restX+wind-flower.x)*16-flower.vx*6.8;
      let ay=(flower.restY+breathe-flower.y)*16-flower.vy*6.8;
      if(pointer.active){
        const dx=flower.x-pointer.x,dy=flower.y-pointer.y,distance=Math.hypot(dx,dy)||1;
        const reach=portrait?Math.min(115,width*.3):Math.min(205,height*.2);
        if(distance<reach){const force=Math.pow(1-distance/reach,2)*1450*options.motion;ax+=dx/distance*force;ay+=dy/distance*force;}
      }
      flower.vx+=ax*step;flower.vy+=ay*step;flower.x+=flower.vx*step;flower.y+=flower.vy*step;
    }
  }

  function spawnPetal(fromTop=true){
    const p=petalPool.find(p=>!p.active);if(!p)return;
    const random=Math.random();p.active=true;p.x=Math.random()*width;p.y=fromTop?-35:Math.random()*height;
    p.speed=12+Math.random()*17;p.drift=(Math.random()-.5)*12;p.size=(portrait?5:6)+Math.random()*(portrait?5:8);
    p.rotation=Math.random()*TAU;p.spin=(Math.random()-.5)*.48;p.phase=Math.random()*TAU;p.age=0;
    p.life=(height+90)/p.speed+6;p.sprite=Math.floor(random*petalSprites.length);p.alpha=.4+Math.random()*.26;
  }

  function clearPetals(){for(const p of petalPool)p.active=false;particleBudget=0;}

  function updatePetals(dt){
    if(!options.petals||reduced.matches){clearPetals();return;}
    particleBudget+=dt*(portrait?1.1:1.55);
    while(particleBudget>=1){spawnPetal();particleBudget-=1;}
    for(const p of petalPool){
      if(!p.active)continue;p.age+=dt;p.y+=p.speed*dt*(.58+options.motion*.52);
      p.x+=(p.drift+Math.sin(p.age*.7+p.phase)*7)*dt*options.motion;p.rotation+=p.spin*dt*options.motion;
      if(p.y>height+40||p.age>p.life||p.x<-70||p.x>width+70)p.active=false;
    }
  }

  function drawStarlight(){
    if(!layoutInfo)return;const theme=themes[options.theme];
    for(let i=0;i<8;i++){
      const a=i*TAU/8+.24,x=layoutInfo.cx+Math.cos(a)*layoutInfo.rx*(1.12+hash(i+75)*.12),y=layoutInfo.cy+Math.sin(a)*layoutInfo.ry*1.17;
      if(y<height*.22&&portrait)continue;
      const pulse=reduced.matches?.5:.36+Math.sin(elapsed*.66+i*1.8)*.19;
      ctx.save();ctx.translate(x,y);ctx.globalAlpha=pulse*(theme.night?1:.8);ctx.strokeStyle=theme.gold;ctx.lineWidth=.8;
      const r=i%3===0?4.2:2.5;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();
      if(theme.night&&glowSprite){ctx.globalAlpha=pulse*.32;ctx.drawImage(glowSprite,-13,-13,26,26);}ctx.restore();
    }
  }

  function drawFrame(dt){
    if(!ready||!ctx||!backplate)return;
    if(dt>0){updateFlowers(dt);updatePetals(dt);}
    ctx.clearRect(0,0,width,height);ctx.drawImage(backplate,0,0,canvas.width,canvas.height,0,0,width,height);
    drawStarlight();const visible=[];const theme=themes[options.theme];
    for(const flower of flowers){
      const progress=reduced.matches?1:clamp((elapsed-flower.birth)/1.7,0,1);
      if(progress<=0)continue;
      const growth=1-Math.pow(1-progress,3);
      const headX=flower.baseX+(flower.x-flower.baseX)*growth;
      const headY=flower.baseY+(flower.y-flower.baseY)*growth;
      const bend=(headX-flower.baseX)*.17;
      ctx.beginPath();ctx.moveTo(flower.baseX,flower.baseY);
      ctx.bezierCurveTo(flower.baseX-bend,flower.baseY-height*.12,headX+bend,headY+height*.1,headX,headY);
      ctx.globalAlpha=theme.night?.48:.43;ctx.strokeStyle=theme.stem;ctx.lineWidth=portrait?.75:1;ctx.stroke();ctx.globalAlpha=1;
      if(flower.leaf&&growth>.61){
        const fraction=.34+hash(flower.id+81)*.13;
        const leafSize=(portrait?18:26)*(1+flower.ring*.12);
        drawLeaf(flower.baseX+(headX-flower.baseX)*fraction,flower.baseY+(headY-flower.baseY)*fraction,flower.leafSide*(.67+flower.turn),leafSize,Math.min(1,(growth-.61)/.39)*(theme.night?.62:.52));
      }
      visible.push({flower,headX,headY,growth});
    }
    // Una cinta delicada deja todo el protagonismo a las flores.
    if(layoutInfo&&elapsed>.2){
      const bx=layoutInfo.cx,by=layoutInfo.baseY-height*.028,scale=portrait?.7:1;
      ctx.save();ctx.translate(bx,by);ctx.scale(scale,scale);ctx.globalAlpha=clamp(elapsed/3,0,.78);ctx.strokeStyle=theme.night?'#d3a0ad':'#b17586';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(-13,0);ctx.bezierCurveTo(-81,-37,-73,28,-7,10);ctx.bezierCurveTo(75,25,79,-34,12,1);ctx.bezierCurveTo(-6,9,-7,43,-31,55);ctx.moveTo(6,9);ctx.quadraticCurveTo(14,45,45,49);ctx.stroke();ctx.restore();
    }
    for(const {flower,headX,headY,growth} of visible){
      const radius=flower.size*growth;
      ctx.save();ctx.translate(headX,headY);ctx.rotate(flower.turn+flower.vx*.0013);ctx.globalAlpha=Math.min(1,growth*1.9);
      ctx.drawImage(sprites[flower.sprite],-radius,-radius,radius*2,radius*2);ctx.restore();
    }
    if(options.petals&&!reduced.matches)for(const p of petalPool){
      if(!p.active)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);
      const flutter=.32+.68*Math.abs(Math.cos(p.age*.65+p.phase));ctx.scale(flutter,1);ctx.globalAlpha=p.alpha*Math.min(1,p.age+.15,(p.life-p.age)/2);
      ctx.drawImage(petalSprites[p.sprite],-p.size/2,-p.size*.7,p.size,p.size*1.4);ctx.restore();
    }
    ctx.globalAlpha=1;syncDebug();
  }

  function canAnimate(){return ready&&!reduced.matches&&!document.hidden&&suspended.size===0;}

  function stopLoop(){
    if(raf)cancelAnimationFrame(raf);raf=0;running=false;lastStamp=null;paintBudget=0;physicsPending=0;pointer.active=false;syncDebug(true);
  }

  function tick(now){
    raf=0;if(!canAnimate()){stopLoop();return;}
    const delta=lastStamp===null?0:clamp((now-lastStamp)/1000,0,.1);lastStamp=now;
    // El tiempo de crecimiento suma tiempo visible; nunca usa una fecha absoluta.
    elapsed+=delta;paintBudget+=delta;physicsPending+=delta;
    const interval=1/options.fps;
    const due=Math.floor((paintBudget+.0005)/interval);
    if(due>0){drawFrame(physicsPending);physicsPending=0;paintBudget=Math.max(0,paintBudget-due*interval);}
    raf=requestAnimationFrame(tick);
  }

  function ensureRunning(){
    if(!ready)return;
    if(!canAnimate()){stopLoop();return;}
    if(running&&raf)return;
    running=true;lastStamp=null;paintBudget=0;physicsPending=0;raf=requestAnimationFrame(tick);syncDebug(true);
  }

  function setSuspended(reason,paused){
    if(paused)suspended.add(reason);else suspended.delete(reason);
    if(paused)stopLoop();else ensureRunning();
  }

  function regrowInternal(){
    elapsed=reduced.matches?GROWTH_SECONDS:0;clearPetals();
    for(const flower of flowers){flower.x=flower.restX;flower.y=flower.restY;flower.vx=0;flower.vy=0;}
    lastStamp=null;paintBudget=0;physicsPending=0;drawFrame(0);syncDebug(true);
  }

  function stats(){
    return {ready,elapsed:Number(elapsed.toFixed(3)),growth:reduced.matches?1:clamp(elapsed/GROWTH_SECONDS,0,1),flowers:flowers.length,
      particles:petalPool.reduce((n,p)=>n+(p.active?1:0),0),running,width,height,theme:options.theme};
  }

  // Señales de QA accesibles desde el DOM, sin texto visible ni temporizadores.
  function syncDebug(force=false){
    if(!canvas)return;
    const stamp=performance.now();if(!force&&stamp-lastDebugStamp<650)return;lastDebugStamp=stamp;
    const state=stats();
    canvas.setAttribute('data-ready',String(state.ready));
    canvas.setAttribute('data-growth',String(state.growth));
    canvas.setAttribute('data-flowers',String(state.flowers));
    canvas.setAttribute('data-particles',String(state.particles));
    canvas.setAttribute('data-running',String(state.running));
    canvas.setAttribute('data-theme',state.theme);
    canvas.setAttribute('data-elapsed',String(state.elapsed));
  }

  function setOptions(partial){
    const previous=options,clean=sanitize(partial),next={...options,...clean};options=next;
    if(!ready)prebootOverrides={...prebootOverrides,...clean};
    if(ready){
      if(previous.theme!==next.theme||previous.density!==next.density||previous.placement!==next.placement)buildLayout();
      if(!next.petals)clearPetals();
      drawFrame(0);ensureRunning();
    }
    syncDebug(true);return stats();
  }

  const api={
    pause(){setSuspended('manual',true);return stats();},
    resume(request={}){if(request&&request.regrow===true)regrowInternal();setSuspended('manual',false);return stats();},
    regrow(){regrowInternal();ensureRunning();return stats();},
    setOptions,stats
  };
  window.NinaGarden=Object.freeze(api);

  // Lively transmite valores simples; nunca se evalúa código ni contenido remoto.
  window.livelyPropertyListener=(name,value)=>{
    const key=String(name).toLowerCase();
    if(key==='theme')setOptions({theme:['blush','night','sage'][Number(value)]||String(value)});
    else if(key==='density')setOptions({density:Number(value)/100});
    else if(key==='motion')setOptions({motion:Number(value)/100});
    else if(key==='petals')setOptions({petals:value===true||value===1||value==='true'});
    else if(key==='placement')setOptions({placement:['center','right','left'][Number(value)]||String(value)});
    else if(key==='fps')setOptions({fps:[24,30,45][Number(value)]||Number(value)});
  };
  window.livelyWallpaperPlaybackChanged=data=>{
    try{const state=typeof data==='string'?JSON.parse(data):data;if(state&&typeof state.IsPaused==='boolean')setSuspended('lively',state.IsPaused);}catch{}
  };

  function boot(){
    if(ready)return;canvas=document.getElementById('garden');if(!canvas)return;
    ctx=canvas.getContext('2d',{alpha:false});if(!ctx)return;
    document.documentElement.classList.add('nina-wallpaper-root');document.body.classList.add('nina-wallpaper');canvas.classList.add('garden-canvas');
    const config=document.getElementById('wallpaper-options');
    if(config){try{options={...options,...sanitize(JSON.parse(config.textContent||'{}')),...prebootOverrides};}catch{}}
    prepareSprites();ready=true;if(reduced.matches)elapsed=GROWTH_SECONDS;
    resize();
    if(options.petals&&!reduced.matches){for(let i=0;i<8;i++)spawnPetal(false);drawFrame(0);}
    canvas.addEventListener('pointermove',event=>{if(reduced.matches)return;const rect=canvas.getBoundingClientRect();pointer.x=event.clientX-rect.left;pointer.y=event.clientY-rect.top;pointer.active=true;},{passive:true});
    canvas.addEventListener('pointerdown',event=>{if(reduced.matches)return;const rect=canvas.getBoundingClientRect();pointer.x=event.clientX-rect.left;pointer.y=event.clientY-rect.top;pointer.active=true;},{passive:true});
    canvas.addEventListener('pointerleave',()=>{pointer.active=false;},{passive:true});
    canvas.addEventListener('pointerup',event=>{if(event.pointerType!=='mouse')pointer.active=false;},{passive:true});
    canvas.addEventListener('pointercancel',()=>{pointer.active=false;},{passive:true});
    window.addEventListener('resize',()=>{if(resizeQueued)clearTimeout(resizeQueued);resizeQueued=setTimeout(()=>{resizeQueued=0;resize();},100);},{passive:true});
    ensureRunning();syncDebug(true);
  }

  document.addEventListener('visibilitychange',()=>setSuspended('hidden',document.hidden));
  window.addEventListener('pagehide',()=>setSuspended('page',true));
  window.addEventListener('pageshow',()=>setSuspended('page',false));
  const motionChanged=()=>{
    if(!ready)return;
    if(reduced.matches){stopLoop();elapsed=Math.max(elapsed,GROWTH_SECONDS);clearPetals();for(const f of flowers){f.x=f.restX;f.y=f.restY;f.vx=0;f.vy=0;}drawFrame(0);}
    else ensureRunning();
  };
  if(reduced.addEventListener)reduced.addEventListener('change',motionChanged);else reduced.addListener(motionChanged);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
<script>
// La galería puede controlar sus vistas previas incluso al abrir archivos locales.
window.addEventListener('message',function(event){
  if(window.parent===window||event.source!==window.parent||!event.data)return;
  const message=event.data;
  if(message.type==='nina-options'&&message.options&&window.NinaGarden)window.NinaGarden.setOptions(message.options);
  else if(message.type==='nina-regrow'&&window.NinaGarden)window.NinaGarden.regrow();
  else if(message.type==='nina-pause'&&window.NinaGarden)window.NinaGarden.pause();
  else if(message.type==='nina-resume'&&window.NinaGarden)window.NinaGarden.resume();
});
</script></body></html>
